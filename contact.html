<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
</head>

<body style="text-align: center; font-family: Arial, sans-serif; color: #333;">
    <iframe src="./douglas.html" frameborder="0" width="100%" height="120px" overflow="hidden" scrolling="no"></iframe>
    <h3>Find us at:</h3>
    <p>Legacy Towers, Block B, 2nd Floor Plot 5, Kyadondo Road,
        Nakasero, Kampala, Uganda. You can reach us via email at <a href="info@ira.go.ug">info@ira.go.ug</a>.
        Or Tel. +256 417 425 500. <br> We look forward to hearing from you!
    </p>

    <section>
        <h3>
            Fill the form below.
        </h3>
        <form name="contact" method="POST" data-netlify="true" action="./home.html">
            <input type="hidden" name="form-name" value="contact">
            <p>
                <label>Name of client: <input type="text" name="name" /></label>
            </p>
            <p>
                <label>Client Email: <input type="email" name="email" /></label>
            </p>
            <p>
                <label>Subject: <select name="subject[]" multiple>
                        <option value="appreciations">Appreciation</option>
                        <option value="complaint">Complaint</option>
                        <option value="inquiry">Inquiry</option>
                    </select></label>
            </p>
            <p>
                <label>Message: <textarea name="message"></textarea></label>
            </p>
            <p>
                <button type="submit">Send</button>
                <button type="button">Cancel</button>
            </p>
        </form>
    </section>
</body>

</html>
