<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netlify forms</title>
</head>

<body style="text-align: center; font-family: Arial, sans-serif; color: #333; border-bottom: 1px solid #333;">
    <form name="contact" method="POST" data-netlify="true">
        <p>
            <label>Name of client: <input type="text" name="name" /></label>
        </p>
        <p>
            <label>Client Email: <input type="email" name="email" /></label>
        </p>
        <p>
            <label>Subject: <select name="subject[]" multiple>
                    <option value="appreciations">Appreciation</option>
                    <option value="complaint">Complaint</option>
                    <option value="inquiry">Inquiry</option>
                </select></label>
        </p>
        <p>
            <label>Message: <textarea name="message"></textarea></label>
        </p>
        <p>
            <button type="submit">Send</button>
            <button type="button">Cancel</button>
        </p>
    </form>
</body>

</html>
